org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build speed: the modules here are small but the task graph is wide, so running
# independent tasks at once and reusing outputs across runs is most of the win.
# The local build cache also means a push that only edits one file does not
# recompile the rest.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
