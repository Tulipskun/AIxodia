<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0b0e14; overflow: hidden; }
    /* Fixed edges rather than inset: the terminal must have a real height even
       in a WebView that has not measured its layout viewport yet. */
    #term { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    /* The gutter lives on .xterm because the fit addon subtracts the terminal
       element's own padding from the box it measures. */
    #term .xterm { padding: 6px 4px 4px 8px; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #aab3c0; font: 13px -apple-system, Roboto, sans-serif; background: #0b0e14;
      pointer-events: none; opacity: 1; transition: opacity .15s;
    }
    #overlay.hidden { opacity: 0; }
    .xterm .xterm-viewport { background: #0b0e14 !important; }
  </style>
</head>
<body>
<div id="term"></div>
<div id="overlay">Connecting…</div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
(function () {
  // A phone window is never this small. Anything less is a measurement taken
  // before the WebView laid the page out, not a real window: sending it would
  // give the shell a one-row pty, and a one-row pty paints every line on the
  // same row for the rest of the session.
  var MIN_COLS = 10;
  var MIN_ROWS = 2;

  var term = null;
  var fit = null;
  var ws = null;
  var ended = false;
  var overlay = document.getElementById('overlay');
  var host = document.getElementById('term');
  var fitTimer = 0;

  function bridge(name, args) {
    try {
      if (window.AndroidTerminal && typeof window.AndroidTerminal[name] === 'function') {
        window.AndroidTerminal[name].apply(window.AndroidTerminal, args || []);
      }
    } catch (e) { /* bridge is optional in a plain browser */ }
  }

  function show(text) {
    overlay.textContent = text;
    overlay.classList.remove('hidden');
  }

  function hide() { overlay.classList.add('hidden'); }

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !term) return;
    if (term.cols < MIN_COLS || term.rows < MIN_ROWS) return;
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }

  // applyFit resizes the terminal only when the box it measured would hold a
  // real terminal. It reports whether that happened, so the caller can retry
  // instead of accepting a bogus size.
  function applyFit() {
    if (!fit || !term) return false;
    var d = null;
    try { d = fit.proposeDimensions(); } catch (e) { d = null; }
    if (!d || !isFinite(d.cols) || !isFinite(d.rows)) return false;
    if (d.cols < MIN_COLS || d.rows < MIN_ROWS) return false;
    try { fit.fit(); } catch (e) { return false; }
    return true;
  }

  function fitNow() {
    if (!applyFit()) return false;
    sendResize();
    return true;
  }

  // A WebView can run the page before its view has been laid out (the phone
  // opened the window folded, or the activity is still measuring). The fit
  // addon would then see a box of zero height and report one row. Keep trying
  // for a few seconds until the box is real — the deadline is wall time, not
  // frames, because a WebView that is not being drawn hands out frames slowly.
  function fitUntilSized(withinMs) {
    if (fitNow()) return;
    if (!term || Date.now() >= withinMs) return;
    setTimeout(function () { fitUntilSized(withinMs); }, 50);
  }

  function retryFit(ms) { fitUntilSized(Date.now() + ms); }

  // Called by the host on every layout change: the WebView size is the truth
  // about the window, whatever the page measured when it started.
  window.fitAndResize = function () { retryFit(3000); };

  window.startTerminal = function (url, cols, rows) {
    ended = false;
    if (ws) { try { ws.close(); } catch (e) { } ws = null; }
    if (term) { try { term.dispose(); } catch (e) { } term = null; }
    show('Connecting…');
    term = new Terminal({
      cursorBlink: true,
      convertEol: false,
      scrollback: 5000,
      fontSize: 13,
      fontFamily: 'monospace',
      theme: {
        background: '#0b0e14', foreground: '#d7dce5', cursor: '#7aa2f7',
        selectionBackground: '#33467c', black: '#15161e', red: '#f7768e',
        green: '#9ece6a', yellow: '#e0af68', blue: '#7aa2f7', magenta: '#bb9af7',
        cyan: '#7dcfff', white: '#a9b1d6'
      }
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(host);
    retryFit(4000);
    term.focus();

    term.onData(function (data) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(new TextEncoder().encode(data));
    });
    term.onResize(function () { sendResize(); });

    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      hide();
      bridge('onOpen', []);
      retryFit(2000);
      term.focus();
    };
    ws.onmessage = function (event) {
      if (typeof event.data === 'string') {
        var msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === 'ready') {
          hide();
          bridge('onReady', [msg.shell || '', msg.cwd || '', msg.id || '', msg.cols || 0, msg.rows || 0, msg.pid || 0]);
        } else if (msg.type === 'exit') {
          ended = true;
          show('Session ended' + (msg.code != null ? ' (' + msg.code + ')' : ''));
          bridge('onEnded', ['exit', String(msg.code == null ? 0 : msg.code)]);
        } else if (msg.type === 'error') {
          ended = true;
          show(msg.error || 'Terminal error');
          bridge('onEnded', ['error', msg.error || 'Terminal error']);
        }
      } else {
        term.write(new Uint8Array(event.data));
      }
    };
    ws.onerror = function () { show('Connection failed'); };
    ws.onclose = function () {
      if (ended) return;
      show('Disconnected — reconnecting…');
      bridge('onDisconnected', []);
    };
  };

  window.terminalInput = function (text) {
    if (term) term.paste(text);
  };

  window.closeTerminal = function () {
    ended = true;
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ type: 'close' })); } catch (e) { }
    }
    if (ws) { try { ws.close(); } catch (e) { } }
    if (term) { try { term.dispose(); } catch (e) { } }
  };

  // Refit whenever the box changes: unfold, rotation, keyboard, window resize.
  window.addEventListener('resize', function () { retryFit(1500); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { retryFit(1500); });
  }
  if (window.ResizeObserver && host) {
    new ResizeObserver(function () {
      if (fitTimer) return;
      fitTimer = setTimeout(function () { fitTimer = 0; fitNow(); }, 60);
    }).observe(host);
  }
})();
</script>
</body>
</html>
