<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0b0e14; overflow: hidden; }
    /* Fixed edges rather than inset: the terminal must have a real height even
       in a WebView that has not measured its layout viewport yet. */
    #term { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    /* The gutter lives on .xterm because the fit addon subtracts the terminal
       element's own padding from the box it measures. */
    #term .xterm { padding: 6px 4px 4px 8px; }
    /* A WebView draws overlay scrollbars: they take no layout width, so xterm's
       "difference is 0, assume 15px" guess made the fit addon reserve a bar
       that never appears — two columns of the screen went unused. The width
       override in the script is the real fix; this keeps a bar from being
       painted over the last column on a browser that does draw one. */
    .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #aab3c0; font: 13px -apple-system, Roboto, sans-serif; background: #0b0e14;
      pointer-events: none; opacity: 1; transition: opacity .15s;
    }
    #overlay.hidden { opacity: 0; }
    .xterm .xterm-viewport { background: #0b0e14 !important; }
  </style>
</head>
<body>
<div id="term"></div>
<div id="overlay">Connecting…</div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
(function () {
  // A phone window is never this small. Anything less is a measurement taken
  // before the WebView laid the page out, not a real window: sending it would
  // give the shell a one-row pty, and a one-row pty paints every line on the
  // same row for the rest of the session.
  var MIN_COLS = 10;
  var MIN_ROWS = 2;

  var term = null;
  var fit = null;
  var ws = null;
  var ended = false;
  var overlay = document.getElementById('overlay');
  var host = document.getElementById('term');
  var fitTimer = 0;
  // A phone keyboard has no Ctrl key, so the host arms one from its key bar.
  // The next character typed goes out as its control code and the arm is spent
  // — the same as holding Ctrl down for exactly one key.
  var ctrlArmed = false;

  function bridge(name, args) {
    try {
      if (window.AndroidTerminal && typeof window.AndroidTerminal[name] === 'function') {
        window.AndroidTerminal[name].apply(window.AndroidTerminal, args || []);
      }
    } catch (e) { /* bridge is optional in a plain browser */ }
  }

  function show(text) {
    overlay.textContent = text;
    overlay.classList.remove('hidden');
  }

  function hide() { overlay.classList.add('hidden'); }

  function sendText(text) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(new TextEncoder().encode(text));
  }

  // ctrlByte maps a typed character to what Ctrl+that key would send. Returns
  // -1 for characters Ctrl has no meaning for.
  function ctrlByte(ch) {
    if (ch === ' ' || ch === '@') return 0;
    if (ch === '?') return 127;
    var code = ch.toUpperCase().charCodeAt(0);
    if (code >= 0x40 && code <= 0x5f) return code & 0x1f;
    return -1;
  }

  function setCtrlArmed(on) {
    ctrlArmed = !!on;
    bridge('onCtrl', [ctrlArmed]);
  }

  // Arrow and Home/End follow the cursor-key mode the terminal is in: tmux
  // switches it on when the program inside asks, and an application-mode
  // terminal that is sent CSI arrows instead of SS3 gets nothing but beeps.
  function cursorKey(final) {
    var app = false;
    try { app = !!(term && term.modes && term.modes.applicationCursorKeysMode); } catch (e) { }
    return (app ? '\x1bO' : '\x1b[') + final;
  }

  window.setCtrlArmed = setCtrlArmed;
  window.toggleCtrl = function () { setCtrlArmed(!ctrlArmed); };
  window.focusTerminal = function () { if (term) { try { term.focus(); } catch (e) { } } };

  // pressKey sends a key the phone keyboard does not have. Focus is only kept
  // if the keyboard was already up: tapping Esc to leave a program should not
  // pull the keyboard over the screen.
  window.pressKey = function (name) {
    var seq;
    switch (name) {
      case 'esc': seq = '\x1b'; break;
      case 'tab': seq = '\t'; break;
      case 'up': seq = cursorKey('A'); break;
      case 'down': seq = cursorKey('B'); break;
      case 'right': seq = cursorKey('C'); break;
      case 'left': seq = cursorKey('D'); break;
      case 'home': seq = cursorKey('H'); break;
      case 'end': seq = cursorKey('F'); break;
      case 'pgup': seq = '\x1b[5~'; break;
      case 'pgdn': seq = '\x1b[6~'; break;
      case 'ctrlc': seq = '\x03'; break;
      case 'ctrld': seq = '\x04'; break;
      case 'ctrll': seq = '\x0c'; break;
      default: return;
    }
    var typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
    setCtrlArmed(false);
    sendText(seq);
    if (typing) window.focusTerminal();
  };

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !term) return;
    if (term.cols < MIN_COLS || term.rows < MIN_ROWS) return;
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }

  // applyFit resizes the terminal only when the box it measured would hold a
  // real terminal. It reports whether that happened, so the caller can retry
  // instead of accepting a bogus size.
  function applyFit() {
    if (!fit || !term) return false;
    var d = null;
    try { d = fit.proposeDimensions(); } catch (e) { d = null; }
    if (!d || !isFinite(d.cols) || !isFinite(d.rows)) return false;
    if (d.cols < MIN_COLS || d.rows < MIN_ROWS) return false;
    try { fit.fit(); } catch (e) { return false; }
    return true;
  }

  function fitNow() {
    if (!applyFit()) return false;
    sendResize();
    return true;
  }

  // A WebView can run the page before its view has been laid out (the phone
  // opened the window folded, or the activity is still measuring). The fit
  // addon would then see a box of zero height and report one row. Keep trying
  // for a few seconds until the box is real — the deadline is wall time, not
  // frames, because a WebView that is not being drawn hands out frames slowly.
  function fitUntilSized(withinMs) {
    if (fitNow()) return;
    if (!term || Date.now() >= withinMs) return;
    setTimeout(function () { fitUntilSized(withinMs); }, 50);
  }

  function retryFit(ms) { fitUntilSized(Date.now() + ms); }

  // Called by the host on every layout change: the WebView size is the truth
  // about the window, whatever the page measured when it started.
  window.fitAndResize = function () { retryFit(3000); };

  window.startTerminal = function (url, cols, rows) {
    ended = false;
    setCtrlArmed(false);
    closeSocket();
    if (term) { try { term.dispose(); } catch (e) { } term = null; }
    fit = null;
    show('Connecting…');
    term = new Terminal({
      cursorBlink: true,
      convertEol: false,
      scrollback: 5000,
      fontSize: 13,
      fontFamily: 'monospace',
      theme: {
        background: '#0b0e14', foreground: '#d7dce5', cursor: '#7aa2f7',
        selectionBackground: '#33467c', black: '#15161e', red: '#f7768e',
        green: '#9ece6a', yellow: '#e0af68', blue: '#7aa2f7', magenta: '#bb9af7',
        cyan: '#7dcfff', white: '#a9b1d6'
      }
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(host);
    // The fit addon subtracts the viewport's scrollbar width, and xterm works
    // that width out as "viewport width - scroll area width, or 15 when that is
    // zero". A WebView uses overlay scrollbars, so the difference really is
    // zero and the 15px fallback was taken for a bar that is never drawn: two
    // columns were reserved for it and the program's frame stopped short of the
    // right edge. Report zero — and swallow xterm's own writes to it, since it
    // recomputes the property whenever the scroll area is synced.
    var vp = term._core && term._core.viewport;
    if (vp) {
      try {
        Object.defineProperty(vp, 'scrollBarWidth', {
          configurable: true,
          get: function () { return 0; },
          set: function () { }
        });
      } catch (e) { /* a future xterm can keep its own number */ }
    }
    retryFit(4000);
    term.focus();

    term.onData(function (data) {
      if (ctrlArmed && data.length === 1) {
        var code = ctrlByte(data);
        if (code >= 0) {
          setCtrlArmed(false);
          sendText(String.fromCharCode(code));
          return;
        }
      }
      sendText(data);
    });
    term.onResize(function () { sendResize(); });

    ws = new WebSocket(url);
    // Every handler below belongs to this one socket. Switching tabs disposes
    // the previous one, and its close would otherwise arrive after the new
    // socket is in place — reported as a disconnect, which asks the host to
    // reconnect, which closes the socket again: a loop that never settles.
    var sock = ws;
    sock.binaryType = 'arraybuffer';
    sock.onopen = function () {
      if (sock !== ws) return;
      hide();
      bridge('onOpen', []);
      retryFit(2000);
      term.focus();
    };
    sock.onmessage = function (event) {
      if (sock !== ws) return;
      if (typeof event.data === 'string') {
        var msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === 'ready') {
          hide();
          bridge('onReady', [msg.shell || '', msg.cwd || '', msg.id || '', msg.cols || 0, msg.rows || 0, msg.pid || 0]);
        } else if (msg.type === 'exit') {
          ended = true;
          show('Session ended' + (msg.code != null ? ' (' + msg.code + ')' : ''));
          bridge('onEnded', ['exit', String(msg.code == null ? 0 : msg.code)]);
        } else if (msg.type === 'error') {
          ended = true;
          show(msg.error || 'Terminal error');
          bridge('onEnded', ['error', msg.error || 'Terminal error']);
        }
      } else {
        term.write(new Uint8Array(event.data));
      }
    };
    sock.onerror = function () {
      if (sock !== ws) return;
      show('Connection failed');
    };
    sock.onclose = function () {
      if (sock !== ws || ended) return;
      show('Disconnected — reconnecting…');
      bridge('onDisconnected', []);
    };
  };

  window.terminalInput = function (text) {
    if (term) term.paste(text);
  };

  // A finger on glass produces no wheel event, and xterm's own touch handling
  // gives up the moment the program turns mouse reporting on — which is exactly
  // what a full-screen program does. So a vertical drag is turned into what a
  // mouse wheel would have produced, by the same rules:
  //   shell        — move the terminal's own scrollback;
  //   TUI + mouse  — a wheel report, so the program scrolls itself;
  //   TUI, no mouse— a page key. Arrows are what xterm itself sends here, but
  //                  in opencode (and most TUIs) an arrow moves a cursor, and
  //                  the message list pages with PgUp/PgDn.
  var TOUCH_STEP = 48; // px of drag per scroll tick

  function scrollTick(dir, x, y) {
    if (!term) return;
    var alt = false, mouse = false;
    try { alt = term.buffer.active.type === 'alternate'; } catch (e) { }
    try { mouse = term.modes.mouseTrackingMode !== 'none'; } catch (e) { }
    // A program that reads the mouse scrolls itself, whichever screen it is on,
    // so the mouse is checked before the buffer. The report has to carry the
    // cell the finger is over — opencode scrolls the pane under the pointer,
    // and a report at the top-left corner scrolls nothing at all.
    if (mouse && term.element) {
      try {
        term.element.dispatchEvent(new WheelEvent('wheel', {
          deltaY: dir * 50, deltaMode: 0, bubbles: true, cancelable: true,
          clientX: x, clientY: y
        }));
        return;
      } catch (e) { }
    }
    if (!alt) {
      try { term.scrollLines(dir * 3); } catch (e) { }
      return;
    }
    // No scrollback and no mouse: the program's own paging keys are all that is
    // left. xterm would send arrows here, which move a cursor in most TUIs.
    sendText(dir > 0 ? '\x1b[6~' : '\x1b[5~');
  }

  // A drag is only taken over where xterm cannot handle it: an alternate screen
  // (no local scrollback to move) or a program that reads the mouse (xterm
  // ignores touch while mouse reporting is on). A plain shell keeps xterm's own
  // touch scrolling.
  function takesTouch() {
    if (!term) return false;
    try {
      if (term.buffer.active.type === 'alternate') return true;
      return term.modes.mouseTrackingMode !== 'none';
    } catch (e) {
      return false;
    }
  }

  var touchOn = false, touchMoved = false, touchY = 0, touchX = 0, touchAcc = 0;

  host.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || !takesTouch()) { touchOn = false; return; }
    touchOn = true;
    touchMoved = false;
    touchAcc = 0;
    touchY = e.touches[0].clientY;
    touchX = e.touches[0].clientX;
  }, { passive: true });

  host.addEventListener('touchmove', function (e) {
    if (!touchOn || e.touches.length !== 1) return;
    var t = e.touches[0];
    var dy = touchY - t.clientY;
    var dx = t.clientX - touchX;
    touchY = t.clientY;
    touchX = t.clientX;
    if (!touchMoved) {
      if (Math.abs(dy) < 10 && Math.abs(dx) < 10) return;
      if (Math.abs(dx) > Math.abs(dy)) { touchOn = false; return; } // a sideways drag is not a scroll
      touchMoved = true;
    }
    e.preventDefault();
    touchAcc += dy;
    while (Math.abs(touchAcc) >= TOUCH_STEP) {
      var dir = touchAcc > 0 ? 1 : -1;
      touchAcc -= dir * TOUCH_STEP;
      scrollTick(dir, t.clientX, t.clientY);
    }
  }, { passive: false });

  function endTouch() { touchOn = false; touchMoved = false; touchAcc = 0; }
  host.addEventListener('touchend', endTouch);
  host.addEventListener('touchcancel', endTouch);

  // closeSocket drops the current socket on purpose. Clearing ws first is what
  // makes its handlers see themselves as stale.
  function closeSocket() {
    var old = ws;
    ws = null;
    if (!old) return;
    try { old.close(); } catch (e) { }
  }

  window.closeTerminal = function () {
    ended = true;
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ type: 'close' })); } catch (e) { }
    }
    closeSocket();
    if (term) { try { term.dispose(); } catch (e) { } term = null; }
    fit = null;
  };

  // Refit whenever the box changes: unfold, rotation, keyboard, window resize.
  window.addEventListener('resize', function () { retryFit(1500); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { retryFit(1500); });
  }
  // The observer is held in a variable on purpose: an observer nothing points
  // at can be collected and then silently stops reporting.
  var ro = null;
  if (window.ResizeObserver && host) {
    ro = new ResizeObserver(function () {
      if (fitTimer) return;
      fitTimer = setTimeout(function () { fitTimer = 0; fitNow(); }, 60);
    });
    ro.observe(host);
  }

  // Some WebViews deliver neither a resize event nor an observer callback when
  // their view changes while the window is not being drawn. The poll is the
  // fallback: fit only touches the terminal when the measured box disagrees
  // with it, so this costs two style reads a second and nothing else.
  setInterval(function () {
    if (!term || !fit) return;
    var d = null;
    try { d = fit.proposeDimensions(); } catch (e) { return; }
    if (!d || !isFinite(d.cols) || !isFinite(d.rows)) return;
    if (d.cols !== term.cols || d.rows !== term.rows) fitNow();
  }, 700);
})();
</script>
</body>
</html>
