name: dump-keystore (temporary)

# Throwaway workflow: writes the AIXODIA_KEYSTORE_B64 repository secret to an
# artifact so the owner can seed the local release signing key. Delete this file
# and its run once the keystore has been retrieved.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Write secret to file
        env:
          KEY: ${{ secrets.AIXODIA_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEY" > keystore.b64
          echo "bytes: $(wc -c < keystore.b64)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aixodia-keystore-b64
          path: keystore.b64
          retention-days: 1
