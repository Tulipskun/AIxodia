name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One writer for the rolling `latest` release: a second push waits for the
# first instead of racing it, and an in-flight build is never cancelled
# half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set on this runner" >&2; exit 1; }
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit and renderer checks
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/paparazzi/debug/

      - name: Build, sign and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIXODIA_KEYSTORE_B64: ${{ secrets.AIXODIA_KEYSTORE_B64 }}
        run: bash scripts/release.sh
