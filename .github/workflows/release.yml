name: Release

# android.yml builds and verifies every push; it deliberately does not publish.
# This is the one place a release is cut, and it is triggered by hand. It reads
# the same stable signing key from the repository secret, numbers the build one
# past the highest published release, and refuses to publish an APK that is not
# signed with that key — a different key cannot install over the last release.
on:
  workflow_dispatch:

# One release at a time: two runs numbering themselves against the same list
# would race for the same versionCode.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The key is a repository secret, never a file in the repository. A release
      # fails without it: a throwaway key signs an APK nobody can install over an
      # existing one, which is worse than no release at all.
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.AIXODIA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "error: AIXODIA_KEYSTORE_B64 is not set; a release needs the stable key" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > app/aixodia-debug.keystore
          chmod 600 app/aixodia-debug.keystore

      # Next versionCode is one past the highest published release, so an install
      # always moves forward and updates over the previous APK in place. Same
      # rule as scripts/release.sh.
      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | sed -n 's/^v0\.1\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          next=$(( ${latest:-0} + 1 ))
          tag="v0.1.$next"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "error: $tag already exists" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "versionName=0.1.$next" >> "$GITHUB_OUTPUT"
          echo "versionCode=$next" >> "$GITHUB_OUTPUT"
          echo "next release: $tag  (versionCode=$next, from latest=${latest:-none})"

      - name: Build
        run: |
          gradle assembleDebug --console=plain \
            -PaixodiaVersionCode="${{ steps.version.outputs.versionCode }}" \
            -PaixodiaVersionName="${{ steps.version.outputs.versionName }}"

      - name: Verify APK signature (must be stable key)
        run: |
          apk="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          apk_file=app/build/outputs/apk/debug/app-debug.apk
          "$apk" verify --print-certs "$apk_file" | grep -i "SHA-256"
          "$apk" verify --print-certs "$apk_file" | grep -qi "CN=AIxodia"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIxodia.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" AIxodia.apk \
            --title "AIxodia ${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --generate-notes
