name: Worker build

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
  pull_request:
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # The Worker is Kotlin compiled to an ES module; this proves it builds and
      # that the wrangler entry module is produced.
      - name: Build the Kotlin Worker
        run: gradle buildWorker --console=plain

      - name: The entry module is an ES module exporting a default worker
        run: |
          test -f build/worker/index.mjs
          grep -q "export default" build/worker/index.mjs
          test -f build/dist/js/productionExecutable/aixodia-worker.mjs
