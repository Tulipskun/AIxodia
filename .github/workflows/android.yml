name: Android build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: android-sdk-35-buildtools-35.0.0

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The signing key is a repository secret, not a file in the repository:
      # a public repo must not publish the key that signs its own updates. A
      # fresh install without the secret still builds, with a throwaway key.
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.AIXODIA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/aixodia-debug.keystore
          else
            echo "no AIXODIA_KEYSTORE_B64 secret: building with a throwaway debug key"
            keytool -genkeypair -v -keystore app/aixodia-debug.keystore -storepass android \
              -alias aixodia -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AIxodia" >/dev/null
          fi
          chmod 600 app/aixodia-debug.keystore

      - name: Determine release version
        id: version
        run: |
          next="v0.1.${GITHUB_RUN_NUMBER}"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "versionName=${next#v}" >> "$GITHUB_OUTPUT"
          echo "versionCode=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # Re-recording the Paparazzi snapshots renders every composable on screen
      # and is the slowest task in the build. It only has to happen when the UI
      # itself changed, so a change to the data layer or the engine skips it.
      - name: Did the UI change?
        id: ui
        run: |
          if git diff --quiet "${{ github.event.before }}" HEAD -- \
            app/src/main/kotlin/com/tulipskun/aixodia/ui \
            app/src/main/res; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # CI builds and verifies, it does not publish. Releases are cut from a
      # workstation with the same stable key (scripts/release.sh): one writer of
      # release tags, so the two can never race for the same versionCode.
      - name: Build only (fast path)
        run: |
          gradle assembleDebug --console=plain \
            -PaixodiaVersionCode="${{ steps.version.outputs.versionCode }}" \
            -PaixodiaVersionName="${{ steps.version.outputs.versionName }}"

      - name: Run checks (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.ui.outputs.changed }}" = "true" ]; then
            gradle recordPaparazziDebug testDebugUnitTest --console=plain
          else
            gradle testDebugUnitTest --console=plain
          fi

      - name: Upload UI snapshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: app/src/test/snapshots
          retention-days: 1

      - name: Upload test report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AIxodia.apk

      # The signed artifact is for a reviewer to install by hand; publishing to a
      # Release is scripts/release.sh, run from a workstation.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIxodia-${{ steps.version.outputs.tag }}
          path: AIxodia.apk
          retention-days: 1

      - name: Verify APK signature (must be stable key)
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs AIxodia.apk | grep -i "SHA-256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs AIxodia.apk | grep -qi "CN=AIxodia"

      - name: Verify APK 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 AIxodia.apk
