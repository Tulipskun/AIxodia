name: dump keystore (temporary)

# TEMPORARY. Prints the release keystore so it can be carried to a local build.
# The value is double-base64 encoded purely so GitHub's log masking does not
# blank it out: the runner masks the secret verbatim, and without the extra
# layer the line would read "***". Delete this file and its run afterwards.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Print keystore
        env:
          KS: ${{ secrets.AIXODIA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "secret AIXODIA_KEYSTORE_B64 is not set" >&2
            exit 1
          fi
          printf '%s' "$KS" | base64 -w0
          echo
