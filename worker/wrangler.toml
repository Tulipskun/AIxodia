# Runtime config only. No secrets live here: AIXODIA_TOKEN is a Worker secret
# (wrangler secret put / Cloudflare secret store), and the Cloudflare API token
# is only ever an environment variable in the shell that runs wrangler.
name = "aixodia"
# Built by Gradle: `./gradlew buildWorker` writes build/worker/index.mjs,
# which re-exports the compiled Kotlin entry point.
main = "build/worker/index.mjs"
compatibility_date = "2024-10-01"

# D1 database "aixodia" (created 2026-09-23, account 3b953d1c…b37b)
[[d1_databases]]
binding = "DB"
database_name = "aixodia"
database_id = "e8e746ea-691e-43bf-9fe2-c4e4016f29a1"

# Optional: Worker /ws proxy target. Leave unset for direct-daemon mode.
# [vars]
# AI_DAEMON_WS = "wss://your-daemon.example/ws"
